name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev
      - run: make task-cli
      - run: make run-tests
      - run: python3 test_cli_regressions.py
      - run: python3 test_corrupt_data.py
