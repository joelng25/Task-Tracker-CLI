name: Desktop releases
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Unix
        if: runner.os != 'Windows'
        run: c++ -std=c++17 -O2 main.cc task_manager.cpp -o task-cli
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: g++ -std=c++17 -O2 main.cc task_manager.cpp -o task-cli.exe
      - run: python test_corrupt_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: task-cli-${{ runner.os }}
          path: |
            task-cli
            task-cli.exe
      - name: Prepare release file
        shell: bash
        run: |
          mkdir -p release
          if [ -f task-cli.exe ]; then cp task-cli.exe release/task-cli-${{ runner.os }}.exe; else cp task-cli release/task-cli-${{ runner.os }}; fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
